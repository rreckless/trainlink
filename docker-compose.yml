version: '3.8'

services:
  postgresql:
    image: postgres:16-alpine
    container_name: trainlink-db
    environment:
      POSTGRES_USER: trainlink
      POSTGRES_PASSWORD: trainlink
      POSTGRES_DB: trainlink
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trainlink -d trainlink"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: trainlink-cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
