name: Android APK

on:
  # Run by hand: Actions tab, or gh workflow run android-apk.yml --ref <branch>
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 30.0.16248370
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install the Android NDK
        # The runner already has the Android SDK in ANDROID_HOME; this adds the NDK to it
        working-directory: .
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "ndk;${NDK_VERSION}"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend tests
        run: npm test

      - name: Generate the Android project
        run: node_modules/.bin/tauri android init

      - name: Build the APK
        run: node_modules/.bin/tauri android build --debug --apk --target aarch64 --target x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: trainlink-android-apk
          path: frontend/src-tauri/gen/android/app/build/outputs/apk/universal/debug/*.apk
          if-no-files-found: error
